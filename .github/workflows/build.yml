name: Android build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [[ ! -f "$sdk_root/platforms/android-36.1/android.jar" || ! -d "$sdk_root/build-tools/36.0.0" ]]; then
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platforms;android-36.1' 'build-tools;36.0.0'
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PermissionsViewer-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
